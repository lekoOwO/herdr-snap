name: herdr
title: Herdr (Unofficial Snap)
version: "0.8.2"
summary: Community Snap packaging for Herdr
description: |
  Herdr is a terminal-based runtime and workspace manager for coding agents.

  This is an unofficial community-maintained Snap package that repackages the
  official upstream Linux release binaries from herdrdev/herdr. It is not
  currently maintained or endorsed by the Herdr upstream project.

license: Apache-2.0
website:
  - https://herdr.dev
source-code:
  - https://github.com/herdrdev/herdr
issues:
  - https://github.com/lekoOwO/herdr-snap/issues
contact:
  - https://github.com/lekoOwO/herdr-snap/issues

base: core24
grade: stable
confinement: classic

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  herdr:
    command: bin/herdr

parts:
  herdr:
    plugin: nil
    build-packages:
      - ca-certificates
      - curl
    override-build: |
      set -eux

      version="$(craftctl get version)"
      sha256_amd64="976150a14d490c94b243ea2e1a7eb2dfb67f12e36b182db90936f6728e6aecf4"
      sha256_arm64="f55610658e1c2e0d2aaef730b4b2ab885f7f8ba00285ab372bfb14f2e3d5b40d"

      case "${CRAFT_ARCH_BUILD_FOR}" in
        amd64)
          asset="herdr-linux-x86_64"
          sha256="${sha256_amd64}"
          ;;
        arm64)
          asset="herdr-linux-aarch64"
          sha256="${sha256_arm64}"
          ;;
        *)
          echo "Unsupported target architecture: ${CRAFT_ARCH_BUILD_FOR}" >&2
          exit 1
          ;;
      esac

      url="https://github.com/herdrdev/herdr/releases/download/v${version}/${asset}"
      curl --fail --location --retry 3 --output "${asset}" "${url}"
      printf '%s  %s\n' "${sha256}" "${asset}" | sha256sum --check --strict -

      install -Dm755 "${asset}" "${CRAFT_PART_INSTALL}/bin/herdr"
